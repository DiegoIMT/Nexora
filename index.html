function reportsView(){let active=investments.filter(i=>i.status==='Activa'),late=loans.filter(l=>l.status==='Vencido');return heading('CENTRO DE INFORMES','Reportes financieros','Genera reportes generales o individuales, por producto y en distintos formatos')+`<div class="metrics">${metric('Cartera crediticia',money(sum(loans,l=>l.balance)),'Saldo pendiente','▤')}${metric('Capital invertido',money(sum(active,i=>i.capital)),'Inversiones activas','↗','teal')}${metric('Intereses proyectados',money(sum(active,interest)),'Interés simple al vencimiento','◉','violet')}${metric('Saldo en mora',money(sum(late,l=>l.balance)),'Créditos vencidos','◷','orange')}</div><div class="panel" style="margin-top:23px;padding:25px"><div class="paneltitle"><h3>Generador de reportes</h3><span class="hint">Filtros combinables</span></div><p class="sub" style="margin:0 0 20px">Selecciona un cliente específico o toda la cartera, el tipo de información y el formato.</p>${reportOptions()}</div><div class="panel tablepanel" style="margin-top:22px"><div class="tabletop"><h3>Vista previa del reporte</h3><span class="hint">Actualización inmediata</span></div><div id="reportPreview"></div></div>`}
function render(){document.getElementById('crumb').textContent=menu.find(x=>x[0]===section)?.[1]||'';document.getElementById('view').innerHTML=({dashboard,clientes:clientsView,creditos:creditsView,inversiones:investmentsView,pagos:paymentsView,cobranza:collectionView,reportes:reportsView})[section]();updateTable();if(section==='reportes')reportPreview()}function calc(){let c=Number(document.getElementById('calcCapital')?.value),r=Number(document.getElementById('calcRate')?.value),m=Number(document.getElementById('calcMonths')?.value);let valid=Number.isFinite(c)&&c>0&&r>=0&&r<=100&&m>0&&m<=360;document.getElementById('calcInterest').textContent=valid?money(c*r/100*m/12):'—';document.getElementById('calcTotal').textContent=valid?money(c*(1+r/100*m/12)):'—'}function field(id,label,type='text',value='',extra=''){return `<div><label class="fieldlabel" for="${id}">${label}</label><input class="fieldinput" id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(id,label,options){return `<div><label class="fieldlabel" for="${id}">${label}</label><select class="fieldinput" id="${id}">${options.map(([value,label])=>`<option value="${esc(value)}">${esc(label)}</option>`).join('')}</select></div>`}function clientSelect(){return selectField('f_client','Cliente',clients.map(c=>[c.id,c.name]))}function openModal(type){modalType=type;modalId='';document.getElementById('modalTitle').textContent={client:'Registrar cliente',loan:'Nuevo crédito',investment:'Nueva inversión',payment:'Registrar abono'}[type];document.getElementById('modalDesc').textContent='Operación de ejemplo. Los cambios solo se conservan durante esta sesión.';document.getElementById('modalSave').style.display='';let body='';if(type==='client')body=field('f_name','Nombre completo','text','','required maxlength="90"')+field('f_city','Ciudad')+field('f_phone','Teléfono')+field('f_email','Correo electrónico','email');if(type==='loan')body=clientSelect()+field('f_amount','Monto del crédito (MXN)','number','30000','min="1" step="0.01"')+field('f_rate','Tasa anual (%)','number','18','min="0" max="100" step="0.01"')+field('f_months','Plazo (meses)','number','24','min="1" max="120" step="1"');if(type==='investment')body=clientSelect()+field('f_capital','Capital a invertir (MXN)','number','100000','min="1" step="0.01"')+field('f_rate','Tasa anual simple (%)','number','12','min="0" max="100" step="0.01"')+field('f_months','Plazo (meses)','number','12','min="1" max="360" step="1"')+field('f_start','Fecha de inicio','date','2026-11-20');if(type==='payment')body=selectField('f_loan','Crédito',loans.filter(l=>l.balance>0).map(l=>[l.id,`${l.id} · ${cname(l.client)} · ${money(l.balance)}`]))+field('f_amount','Monto del abono (MXN)','number','1000','min="0.01" step="0.01"')+selectField('f_method','Método de pago',['Transferencia','Efectivo','Depósito'].map(x=>[x,x]));document.getElementById('modalBody').innerHTML=`<div class="formgrid">${body}</div>`;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}function saveModal(){const val=id=>document.getElementById(id)?.value;let amount=Number(val('f_amount')),rate=Number(val('f_rate')),months=Number(val('f_months'));if(modalType==='client'){if(!val('f_name')?.trim()||!val('f_city')?.trim()||!val('f_phone')?.trim())return toast('Completa nombre, ciudad y teléfono.');clients.push({id:'CLI-'+String(1+Math.max(...clients.map(c=>Number(c.id.split('-')[1])))).padStart(3,'0'),name:val('f_name').trim(),city:val('f_city').trim(),phone:val('f_phone').trim(),email:val('f_email').trim()})}else if(modalType==='loan'){if(!(amount>0&&rate>=0&&rate<=100&&Number.isInteger(months)&&months>=1&&months<=120))return toast('Verifica monto, tasa y plazo.');loans.push({id:'CRE-'+(1+Math.max(...loans.map(l=>Number(l.id.split('-')[1])))),client:val('f_client'),amount,balance:amount,rate,months,status:'Al corriente',days:0})}else if(modalType==='investment'){let capital=Number(val('f_capital')),start=val('f_start');if(!(capital>0&&rate>=0&&rate<=100&&Number.isInteger(months)&&months>=1&&months<=360&&/^\d{4}-\d{2}-\d{2}$/.test(start)))return toast('Verifica capital, tasa, plazo y fecha.');investments.push({id:'INV-'+(1+Math.max(...investments.map(i=>Number(i.id.split('-')[1])))),client:val('f_client'),capital,rate,months,start,status:'Activa'})}else if(modalType==='payment'){let l=loans.find(x=>x.id===val('f_loan'));if(!l||!(amount>0)||amount>l.balance)return toast('El abono debe ser mayor que cero y no exceder el saldo.');l.balance=Math.round((l.balance-amount)*100)/100;if(l.balance===0){l.status='Liquidado';l.days=0}payments.unshift({id:'PAG-'+String(1+Math.max(...payments.map(p=>Number(p.id.split('-')[1])))).padStart(3,'0'),loan:l.id,date:'2026-11-20',amount,method:val('f_method')})}closeModal();render();toast('Operación simulada registrada correctamente.')}function detail(type,id){modalType='detail';document.getElementById('modalSave').style.display='none';let rows=[],title='';if(type==='client'){let c=clients.find(x=>x.id===id);title='Expediente del cliente';rows=[['Folio',c.id],['Nombre',c.name],['Ciudad',c.city],['Teléfono',c.phone],['Correo',c.email||'No registrado'],['Créditos asociados',loans.filter(l=>l.client===id).length],['Inversiones asociadas',investments.filter(i=>i.client===id).length]]}if(type==='loan'){let l=loans.find(x=>x.id===id);title='Detalle del crédito';rows=[['Folio',l.id],['Cliente',cname(l.client)],['Monto original',money(l.amount)],['Saldo pendiente',money(l.balance)],['Tasa anual',num(l.rate)+'%'],['Plazo',l.months+' meses'],['Estado',l.status],['Días de atraso',l.days]]}if(type==='investment'){let i=investments.find(x=>x.id===id);title='Detalle de inversión';rows=[['Folio',i.id],['Inversionista',cname(i.client)],['Capital inicial',money(i.capital)],['Tasa anual simple',num(i.rate)+'%'],['Plazo',i.months+' meses'],['Inicio',shortDate(i.start)],['Vencimiento',shortDate(maturity(i))],['Interés simple proyectado',money(interest(i))],['Total al vencimiento',money(i.capital+interest(i))],['Estado',i.status]]}document.getElementById('modalTitle').textContent=title;document.getElementById('modalDesc').textContent='Información de ejemplo, exclusivamente demostrativa.';document.getElementById('modalBody').innerHTML=rows.map(([a,b])=>`<div class="summaryline"><span>${esc(a)}</span><strong>${esc(b)}</strong></div>`).join('');document.getElementById('modal').classList.add('show')}function reportFileName(d){return `nexora_${d.type}_${d.cid==='all'?'general':d.cid.toLowerCase()}`}
function saveBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function downloadReport(){let d=reportData(),format=document.getElementById('reportFormat').value;if(!d.rows.length)return toast('No hay datos para generar este reporte.');let name=reportFileName(d);if(format==='csv'){let lines=[d.headers,...d.rows].map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');saveBlob(new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}),name+'.csv');toast('CSV generado correctamente.');return}let header=d.headers.map(h=>`<th>${esc(h)}</th>`).join(''),body=d.rows.map(r=>`<tr>${r.map((v,j)=>`<td>${j===4&&typeof v==='number'?money(v):esc(v)}</td>`).join('')}</tr>`).join('');let title=({integral:'Expediente financiero integral',creditos:'Créditos y saldos',inversiones:'Inversiones e interés simple',pagos:'Historial de pagos',cobranza:'Cartera vencida'})[d.type];let content=`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(title)} · NEXORA</title><style>body{font-family:Arial,sans-serif;color:#1a2940;padding:28px}h1{margin:0;color:#172b4b}h2{font-size:17px;margin:8px 0 20px;color:#4c6183}.meta{font-size:12px;color:#68788e;margin:12px 0 20px}table{border-collapse:collapse;width:100%;font-size:11px}th{background:#172b4b;color:white;text-align:left;padding:10px 8px}td{padding:9px 8px;border-bottom:1px solid #dfe5ef}tr:nth-child(even){background:#f4f7fb}.note{font-size:11px;color:#69788c;margin-top:20px}@page{size:landscape;margin:12mm}@media print{body{padding:0}thead{display:table-header-group}tr{break-inside:avoid}}</style></head><body><h1>NEXORA <span style="font-size:13px;color:#6a7d98">FINANCIAL SUITE</span></h1><h2>${esc(title)}</h2><div class="meta">Cliente: ${esc(d.cid==='all'?'Todos los clientes':cname(d.cid))} · Registros: ${d.rows.length} · Datos ficticios · Moneda: MXN</div><table><thead><tr>${header}</tr></thead><tbody>${body}</tbody></table><p class="note">Documento demostrativo sin validez contable. Intereses calculados con interés simple anual: capital × tasa × meses / 12. No incluye impuestos ni comisiones.</p></body></html>`;if(format==='excel'){saveBlob(new Blob(['\ufeff'+content],{type:'application/vnd.ms-excel;charset=utf-8'}),name+'.xls');toast('Archivo compatible con Excel generado.');return}let win=window.open('','_blank');if(!win){toast('Permite ventanas emergentes para generar el PDF.');return}win.document.open();win.document.write(content);win.document.close();win.focus();setTimeout(()=>win.print(),450);toast('Selecciona «Guardar como PDF» en la ventana de impresión.')}
function exportCSV(){let rows=[['Tipo','Folio','Cliente','Capital o monto MXN','Saldo MXN','Tasa anual %','Plazo meses','Interés simple MXN','Fecha inicio','Fecha vencimiento','Estado']];clients.forEach(c=>rows.push(['Cliente',c.id,c.name,'','','','','','','',c.city]));loans.forEach(l=>rows.push(['Crédito',l.id,cname(l.client),l.amount,l.balance,l.rate,l.months,'','','',l.status]));investments.forEach(i=>rows.push(['Inversión',i.id,cname(i.client),i.capital,'',i.rate,i.months,interest(i),i.start,maturity(i),i.status]));payments.forEach(p=>rows.push(['Pago',p.id,cname(loans.find(l=>l.id===p.loan)?.client),p.amount,'','','','',p.date,'',p.method]));let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='nexora_reporte_demo.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Reporte ficticio exportado.')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});nav();render();
</script></body></html>
